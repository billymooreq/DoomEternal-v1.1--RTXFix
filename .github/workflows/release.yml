# On a tag v<major>.<minor>.<patch>[-suffix]: checks the tag against CMakeLists.txt, builds and tests the
# same way as build.yml, attests the build provenance and publishes a GitHub Release with the installer,
# the zip and their SHA256 files. Tags with a suffix (v0.3.1-rc1, v0.4.0-beta2) become pre-releases.
# See docs/BUILDING.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the tag against CMakeLists.txt
        id: version
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.]+)?$') {
            Write-Output "::error::Tag '$tag' must look like v1.2.3 or v1.2.3-rc1."
            exit 1
          }
          $tagVersion = $Matches[1]
          $prerelease = [bool]$Matches[2]
          $cmake = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(doomfix VERSION (\d+\.\d+\.\d+)').Groups[1].Value
          if ($tagVersion -ne $cmake) {
            Write-Output "::error::Tag '$tag' is version $tagVersion, but CMakeLists.txt says $cmake. Set project(doomfix VERSION $tagVersion ...), commit, and tag that commit."
            exit 1
          }
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Build (Release)
        run: .\scripts\build.ps1 -Config Release -BuildDir build-release

      - name: Test on SwiftShader (software Vulkan, no GPU on the runner)
        run: .\scripts\test_swiftshader.ps1 -BuildDir build-release

      - name: Package
        id: package
        run: .\scripts\package.ps1 -BuildDir build-release -OutDir dist -Version '${{ steps.version.outputs.version }}'

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --allow-downgrade --no-progress -y

      # Code signing of doomfix_layer.dll and doomfix_launcher.exe will go here, before the installer is
      # built from them (the installer itself is signed after the next step).
      - name: Build the installer
        id: installer
        run: .\scripts\build_installer.ps1 -BinDir build-release\bin -OutDir dist -Version '${{ steps.version.outputs.version }}'

      - name: Test the installer (install over install.bat, reinstall, uninstall)
        run: .\scripts\test_installer.ps1 -Setup '${{ steps.installer.outputs.setup }}' -BinDir build-release\bin

      # GitHub only offers artifact attestations for public repositories (and private ones on
      # GitHub Enterprise Cloud), so this step is skipped while the repository is private.
      - name: Attest build provenance
        id: attest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          # Relative paths with '/': subject-path is a glob pattern, and a '\' there may be read as an escape.
          subject-path: |
            build-release/bin/doomfix_layer.dll
            build-release/bin/doomfix_launcher.exe
            dist/${{ steps.installer.outputs.setup_name }}
            dist/${{ steps.package.outputs.name }}.zip

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ZIP_NAME: ${{ steps.package.outputs.name }}.zip
          SHA256: ${{ steps.package.outputs.sha256 }}
          SETUP_NAME: ${{ steps.installer.outputs.setup_name }}
          SETUP_SHA256: ${{ steps.installer.outputs.setup_sha256 }}
          ATTESTED: ${{ steps.attest.outcome == 'success' }}
        run: |
          $notes = Get-Content .github\release-notes.md -Raw
          $verify = if ($env:ATTESTED -eq 'true') {
            "The installer, the zip, the DLL and the launcher have a " +
            "[build provenance attestation](https://github.com/$env:GITHUB_REPOSITORY/attestations): they were built " +
            "by this repository's release workflow from the tagged commit. To check it, install the " +
            "[GitHub CLI](https://cli.github.com) and run:`n`n" +
            '```' + "`ngh attestation verify $env:SETUP_NAME --repo $env:GITHUB_REPOSITORY`n" +
            "gh attestation verify $env:ZIP_NAME --repo $env:GITHUB_REPOSITORY`n" + '```'
          } else { '' }
          $values = [ordered]@{
            '{{VERSION}}' = $env:VERSION; '{{ZIP}}' = $env:ZIP_NAME; '{{SHA256}}' = $env:SHA256
            '{{SETUP}}' = $env:SETUP_NAME; '{{SETUP_SHA256}}' = $env:SETUP_SHA256
            '{{REPO}}' = $env:GITHUB_REPOSITORY; '{{TAG}}' = $env:GITHUB_REF_NAME; '{{VERIFY}}' = $verify
          }
          foreach ($key in $values.Keys) { $notes = $notes.Replace($key, $values[$key]) }
          if ($notes -match '\{\{\w+\}\}') { Write-Output "::error::Unfilled placeholder $($Matches[0]) in .github/release-notes.md"; exit 1 }
          Set-Content release-notes.md $notes -Encoding utf8NoBOM

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = '${{ steps.package.outputs.zip }}'
          $setup = '${{ steps.installer.outputs.setup }}'
          $flags = @('--verify-tag', '--title', "doomfix ${{ steps.version.outputs.version }}", '--notes-file', 'release-notes.md')
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME $setup "$setup.sha256" $zip "$zip.sha256" @flags
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
