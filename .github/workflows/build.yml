# Builds the layer and the launcher (Release), runs doomfix_barrier_test on SwiftShader, builds and tests
# the installer and uploads the release zip and the installer as build artifacts. The same scripts are used
# locally; see docs/BUILDING.md.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build (Release)
        run: .\scripts\build.ps1 -Config Release -BuildDir build-release

      - name: Test on SwiftShader (software Vulkan, no GPU on the runner)
        run: .\scripts\test_swiftshader.ps1 -BuildDir build-release

      - name: Package
        id: package
        run: .\scripts\package.ps1 -BuildDir build-release -OutDir dist

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --allow-downgrade --no-progress -y

      # Code signing of doomfix_layer.dll and doomfix_launcher.exe will go here, before the installer is
      # built from them (the installer itself is signed after the next step).
      - name: Build the installer
        id: installer
        run: .\scripts\build_installer.ps1 -BinDir build-release\bin -OutDir dist

      - name: Test the installer (install over install.bat, reinstall, uninstall)
        run: .\scripts\test_installer.ps1 -Setup '${{ steps.installer.outputs.setup }}' -BinDir build-release\bin

      - name: Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.package.outputs.zip }}
          archive: false
          if-no-files-found: error

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.installer.outputs.setup }}
          archive: false
          if-no-files-found: error
