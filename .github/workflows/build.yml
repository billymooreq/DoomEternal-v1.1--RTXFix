# Builds the layer (Release), runs doomfix_barrier_test on SwiftShader and uploads the release zip
# as a build artifact. The same scripts are used locally; see docs/BUILDING.md.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build (Release)
        run: .\scripts\build.ps1 -Config Release -BuildDir build-release

      - name: Test on SwiftShader (software Vulkan, no GPU on the runner)
        run: .\scripts\test_swiftshader.ps1 -BuildDir build-release

      - name: Package
        id: package
        run: .\scripts\package.ps1 -BuildDir build-release -OutDir dist

      - name: Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.package.outputs.zip }}
          archive: false
          if-no-files-found: error
